info:
  name: user login
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: user@app.com
      - name: password
        type: text
        value: password
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = typeof res.body === "string" ? JSON.parse(res.body) : res.body;
        if (res.status === 200 && body && body.data && body.data.token) {
          bru.setEnvVar("token", body.data.token, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
