info:
  name: send-otp
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}auth/send-otp"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: admin@app.com
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
