info:
  name: reset-password
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}auth/reset-password"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: admin@app.com
      - name: otp
        type: text
        value: "123456"
      - name: password
        type: text
        value: "12345678"
      - name: password_confirmation
        type: text
        value: "12345678"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
