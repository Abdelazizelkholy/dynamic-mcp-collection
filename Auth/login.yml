info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}auth/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: admin@app.com
      - name: password
        type: text
        value: password
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
