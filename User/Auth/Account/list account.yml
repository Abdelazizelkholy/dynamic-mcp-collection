info:
  name: list account
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}user-integrations"
  headers:
    - name: Accept
      value: application/json
    - name: api-key
      value: dev_user_api_key_3e7b1c9a4f6d2058b1a3c9e7d4f6a208
  body:
    type: multipart-form
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = typeof res.body === "string" ? JSON.parse(res.body) : res.body;
        if (res.status === 200 && body && body.data && body.data.token) {
          bru.setEnvVar("token", body.data.token, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
