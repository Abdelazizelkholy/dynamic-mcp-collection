info:
  name: Add file  input to group
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}integrations/1/services/1/input-groups/2/inputs"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
          "field_type": "file",
          "key": "attachment",
          "placeholder": "Upload file",
          "key_type": "body",
          "validation": "nullable",
          "require_from": "user"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
