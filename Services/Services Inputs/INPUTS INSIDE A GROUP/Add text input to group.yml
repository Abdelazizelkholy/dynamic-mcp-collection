info:
  name: Add text input to group
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}integrations/1/services/1/input-groups/2/inputs"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          "field_type": "input",
          "key": "product_name",
          "placeholder": "Enter product name",
          "type": "text",
          "key_type": "body",
          "validation": "required",
          "require_from": "user"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
