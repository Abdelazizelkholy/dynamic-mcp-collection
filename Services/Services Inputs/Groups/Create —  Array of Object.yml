info:
  name: Create —  Array of Object
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}integrations/1/services/1/input-groups"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          "key_name": "items",
          "data_type": "array_of_objects"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
