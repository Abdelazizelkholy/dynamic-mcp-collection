info:
  name: Create — inputs
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}integrations/1/services/1/inputs"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
          "field_type": "input",
          "key": "page",
          "placeholder": "Page number",
          "type": "number",
          "key_type": "query",
          "validation": "nullable",
          "require_from": "user"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
