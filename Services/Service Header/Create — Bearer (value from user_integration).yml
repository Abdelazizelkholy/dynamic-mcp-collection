info:
  name: Create — Bearer (value from user_integration)
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}integrations/1/services/1/headers"
  body:
    type: json
    data: |-
      {
        "headers": [
          {
            "type": "bearer",
            "header_key": "Authorization",
            "concatenate_key": null,
            "require_from": "user_integration",
            "value": "access_token",
            "label": "Bearer Token",
            "description": "OAuth2 access token",
            "is_active": true
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
