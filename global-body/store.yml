info:
  name: store
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}integrations/1/global-body"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          "body": [
              {
                  "key": "store_id",
                  "require_from": "user_integration",
                  "value": "store_id",
                  "label": "Store ID",
                  "description": "Resolved from user integration"
              },
              {
                  "key": "version",
                  "require_from": "admin",
                  "value": "2024-01",
                  "label": "API Version",
                  "description": "Fixed API version"
              }
          ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
