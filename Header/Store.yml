info:
  name: Store
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}integrations/1/headers"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "headers": [
          {
            "type": "normal",
            "header_key": "X-Api-Key",
            "concatenate_key": "Bearer",
            "require_from": "admin",
            "value": "my-api-key",
            "label": "API Key",
            "description": "Static API key",
            "is_active": true
          },
          {
            "type": "bearer",
            "header_key": "Authorization",
            "concatenate_key": null,
            "require_from": "user_integration",
            "value": "access_token",
            "label": "Bearer Token",
            "description": "OAuth2 token",
            "is_active": true
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
