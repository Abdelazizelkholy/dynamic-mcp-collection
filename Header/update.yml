info:
  name: update
  type: http
  seq: 5

http:
  method: PUT
  url: "{{base_url}}integrations/1/headers"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "headers": [
          {
                  "type": "basic_auth",
                  "header_key": "Authorization",
                  "require_from": "admin",
                  "value": "my_username 1",
                  "label": "username",
                  "description": "Basic auth username",
                  "is_active": true
              },
              {
                  "type": "basic_auth",
                  "header_key": "Authorization",
                  "require_from": "admin",
                  "value": "my_password 2",
                  "label": "password",
                  "description": "Basic auth password",
                  "is_active": true
              }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
