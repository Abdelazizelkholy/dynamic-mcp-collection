info:
  name: Store Normal
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}integrations/2/headers"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "headers": [
          {
                  "type": "normal",
                  "header_key": "X-Api-Version",
                  "concatenate_key": null,
                  "require_from": "admin",
                  "value": "2024-01",
                  "label": "API Version",
                  "description": "Fixed API version header",
                  "is_active": true
              }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
